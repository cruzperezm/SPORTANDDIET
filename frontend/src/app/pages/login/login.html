<div id="login-container">
    <h2>Iniciar Sesión</h2>
    <section id="form-section">
        <form [formGroup]="loginForm" (submit)="login()" id="login-form">
            <input formControlName="email" type="email" name="email" pattern="^[A-Za-z0-9]+@[A-Za-z]+(\.[A-Za-z]+)+$" placeholder="Correo Electrónico" required autofocus>
            <input formControlName="password" type="password" name="password" placeholder="Contraseña" required>
            <div id="button-row">
                <input routerLink="" type="button" name="cancel" id="cancel-button" value="Cancelar">
                <input type="submit" id="login-button" value="Iniciar Sesión">
            </div>
        </form>
    </section>
    <section id="external-providers-section">
        <div id="other-login">
            <img [src]="google_logo" alt="Google Logo">
            <img [src]="fb_logo" alt="Facebook Logo">
            <img [src]="icloud_logo" alt="iCloud Logo">
        </div>
    </section>

</div>
