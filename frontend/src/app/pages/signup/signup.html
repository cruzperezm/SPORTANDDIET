<div id="signup-container">
  <h2>Crear Cuenta</h2>
  <section id="form-section">
    <form [formGroup]="signUpForm" id="signup-form" (submit)="signup()">
      <input formControlName="email" type="email" name="email" pattern="^[A-Za-z0-9]+@[A-Za-z]+(\.[A-Za-z]+)+$" placeholder="Correo Electrónico" required autofocus>
      <input formControlName="username" type="username" name="username" placeholder="Usuario" required autofocus>
      <input formControlName="password" type="password" name="password" placeholder="Contraseña" required>
      <input formControlName="confirmPassword" type="password" name="password_2" placeholder="Confirmar Contraseña" required>
      <div id="button-row">
        <input type="button" name="cancel" id="cancel-button" value="Cancelar">
        <input type="submit" value="Crear Cuenta" id="signup-button">
      </div>
    </form>
  </section>
  <section id="external-providers-section">
    <div id="other-signup">
      <img [src]="google_logo" alt="Google Logo">
      <img [src]="fb_logo" alt="Facebook Logo">
      <img [src]="icloud_logo" alt="iCloud Logo">
    </div>
  </section>

</div>
