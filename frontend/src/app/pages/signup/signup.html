<div id="signup-container">
  <h2>Signup</h2>
  <section id="form-section">
    <form action="" id="signup-form">
      <input type="email" name="email" pattern="^[A-Za-z0-9]+@[A-Za-z]+(\.[A-Za-z]+)+$" placeholder="Email" required autofocus>
      <input type="username" name="username" placeholder="Username" required autofocus>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password_2" name="password_2" placeholder="Repeat Password" required>
      <div id="button-row">
        <input type="button" name="cancel" id="cancel-button" value="Cancel">
        <input type="submit" value="Sign Up">
      </div>
    </form>
  </section>
  <section id="external-providers-section">
    <div id="other-signup">
      <img [src]="google_logo" alt="Google Logo" (click)="loginConGoogle()">
      <img [src]="fb_logo" alt="Facebook Logo">
      <img [src]="icloud_logo" alt="iCloud Logo">
    </div>
  </section>

</div>
