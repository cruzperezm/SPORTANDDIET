<div class="dashboard-deporte">
  <section class="left-container">
    <h1 class="section-title">
      {{ userName }}
    </h1>
    <div class="main-content-left">
      <div class="top-graph">
        @for (item of weekData; track item.dia) {
          <div class="bar-element">
            <div class="day-bar" [style.--current]="item.valor"></div>
            <h3>{{ item.dia }}</h3>
            <p>{{ item.valor }}%</p>
          </div>
        }
      </div>
      <div class="bottom-metrics">
        @for (activity of dailyActivities; track activity) {
          <div class="activity-item">
            <div class="activity-title">
              <span>{{ activity.text }} </span>
            </div>
            <div class="activity-progress">
              <span>{{ activity.progress }} </span>
            </div>
          </div>
        }
      </div>
    </div>
  </section>
  <section class="right-container">
    <div class="toggles">
    <div class="rectangle-toggle" (click)="toggleToDieta()">
      <div class="ellipse-toggle">
        <fa-icon [icon]="faRunning" style="color: rgb(249 115 22)"></fa-icon>
      </div>
    </div>
    <div class="deporte-toggle" (click)="goToDeporte()">
      <p class="add">Añadir</p>
    </div>
    </div>
    <div class="main-content-right">
      @for (item of trainingSessions; track item) {
        <div class="training-item">
          <div class="training-title">
            <span>{{ item.text }}</span>
          </div>
          <div class="training-value">
            <span>{{ item.amount }}</span>
          </div>
        </div>
      }
    </div>
  </section>
</div>
