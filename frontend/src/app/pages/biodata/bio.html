<div id="login-container">
  <h2>Signup</h2>
  <section id="form-section">
    <form #f="ngForm" (ngSubmit)="saveData()" id="login-form">

      @if (mail.invalid && (mail.dirty || mail.touched)){
        @if (mail.hasError('required')) {
          <div>Name is required.</div>
        }
      }
        <input [(ngModel)]="email" type="email" name="emailf" pattern="^[A-Za-z0-9]+@[A-Za-z]+(\.[A-Za-z]+)+$" placeholder="Email" required autofocus #mail="ngModel">
        <input type="password" name="password" placeholder="Password" required>
        <div id="button-row">
          <input type="submit" value="Log In" [disabled]="!f.valid">
        </div>
    </form>
  </section>

</div>
